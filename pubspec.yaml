name: marvel_animation_app
description: A marvel example app for testing purposes.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  dio: 5.9.0
  flutter:
    sdk: flutter
  flutter_dotenv: 6.0.0
  flutter_riverpod: 3.1.0
  flutter_screenutil: 5.9.3
  go_router: 17.0.1
  cupertino_icons: 1.0.8
  firebase_core: 4.3.0
  firebase_auth: 6.1.3
  flutter_inappwebview: 6.1.5
  google_maps_flutter: 2.14.0
  cloud_firestore: 6.1.1
  permission_handler: 12.0.1
  cached_network_image: 3.4.1
  shimmer: 3.0.0

dev_dependencies:
  mocktail: 1.0.4
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env