name: Integration Tests - Firebase Test Lab

on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter version to use'
        required: false
        default: '3.38.5'
        type: string
    outputs:
      integration-tests-passed:
        description: 'Whether integration tests passed'
        value: ${{ jobs.integration-test.outputs.tests-passed }}

env:
  FLUTTER_VERSION: ${{ inputs.flutter-version }}

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04
    outputs:
      tests-passed: ${{ steps.test-lab.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ${{ github.workspace }}/.dart_tool/package_config.json
            ${{ github.workspace }}/.packages
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
            project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Enable required APIs
        run: |
          gcloud services enable testing.googleapis.com
          gcloud services enable toolresults.googleapis.com

      - name: Build APK for testing
        run: |
          flutter build apk --debug
          flutter build apk --debug integration_test/login_flow_test.dart

      - name: Run integration tests on Firebase Test Lab
        id: test-lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --test build/app/outputs/flutter-apk/app-debug-androidTest.apk \
            --device model=Pixel2,version=28,locale=en,orientation=portrait \
            --device model=Pixel3,version=29,locale=en,orientation=portrait \
            --timeout 5m \
            --format=json > test_results.json

      - name: Parse test results
        if: always()
        run: |
          if [ -f test_results.json ]; then
            echo "Test results:"
            cat test_results.json
            # Check if tests passed
            if grep -q '"outcome": "PASSED"' test_results.json; then
              echo "✅ All integration tests passed!"
            else
              echo "❌ Some integration tests failed!"
              exit 1
            fi
          else
            echo "❌ No test results file found!"
            exit 1
          fi

      - name: Upload test results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test_results.json
            *.log
          retention-days: 30

      - name: Clean up service account key
        if: always()
        run: rm -f service-account-key.json