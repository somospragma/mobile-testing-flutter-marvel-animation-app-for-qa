name: Firebase App Distribution

on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter version to use'
        required: false
        default: '3.38.5'
        type: string
      release-notes:
        description: 'Release notes for this distribution'
        required: false
        default: 'New build from CI/CD pipeline'
        type: string
    outputs:
      distribution-success:
        description: 'Whether app distribution was successful'
        value: ${{ jobs.distribute.outputs.distribution-success }}

  workflow_dispatch:
    inputs:
      flutter-version:
        description: 'Flutter version to use'
        required: false
        default: '3.38.5'
        type: choice
        options:
          - '3.38.5'
          - '3.35.6'
      release-notes:
        description: 'Release notes for this distribution'
        required: true
        type: string

env:
  FLUTTER_VERSION: ${{ inputs.flutter-version }}

jobs:
  distribute:
    name: 📦 Build & Distribute App
    runs-on: ubuntu-22.04
    outputs:
      distribution-success: ${{ steps.distribute-app.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ${{ github.workspace }}/.dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Clean build
        run: flutter clean && flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK was created
        run: |
          ls -la build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Distribute to Firebase App Distribution
        id: distribute-app
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ vars.FIREBASE_APP_ID_ANDROID }} \
            --release-notes "${{ inputs.release-notes }} | Branch: ${{ github.head_ref || github.ref_name }} | Commit: ${{ github.sha }}"
